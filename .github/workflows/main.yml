name: Build VirtualPhone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q virtualphone.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for build.gradle files..."
          find project -name "build.gradle" -o -name "build.gradle.kts"
          echo "Searching for settings files..."
          find project -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Find project directory
        run: |
          SETTINGS=$(find project -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Create missing debug keystore
        run: |
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            echo "debug.keystore not found. Creating it..."

            keytool -genkeypair \
              -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          else
            echo "debug.keystore already exists."
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualPhone-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
